<!DOCTYPE html>
<!--
  ╔═══════════════════════════════════════════════════════════════════════╗
  ║  套价工具 · 手机版 (m.html)                                            ║
  ║  设计文档: docs/superpowers/specs/2026-10-05-mobile-tool-ui-design.md   ║
  ║                                                                        ║
  ║  ■ 与 tool.html 的关系：代码完全独立，只共享「数据契约」               ║
  ║    - 同一个 Supabase（projects 草稿接力 / benchmark_items / Auth）      ║
  ║    - 同一个 FastAPI（/pricing/single、/export/excel、/export/template） ║
  ║    - 不 import、不复制 DOM，桌面端一行不动                             ║
  ║                                                                        ║
  ║  ■ groups_json schema 权威 = tool.html 的 makeRow() / addSub()         ║
  ║    改 tool.html 的行级或子目级字段时，必须同步本文件的 makeRow()/      ║
  ║    addSub()/collectExportData()，否则跨端接力会丢字段。                ║
  ║                                                                        ║
  ║  ■ 移动端哲学：强调结果，不强调过程调节。所有过程性编辑                ║
  ║    （改子目、调系数、改管理费/利润率）一律留在电脑端。                 ║
  ╚═══════════════════════════════════════════════════════════════════════╝
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6fa5">
<title>套价工具 · 手机版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f0f5fa;--card:#ffffff;--bg3:#f7fafd;--bg4:#eaf1f8;
  --border:#c8d8e8;--bdr2:#a0bcce;
  --acc:#1d6fa5;--acc2:#155d8e;--acc-d:rgba(29,111,165,.10);
  --grn:#0b7b50;--grn-d:rgba(11,123,80,.10);
  --yel:#b07000;--yel-d:rgba(176,112,0,.10);
  --red:#b93232;--red-d:rgba(185,50,50,.10);
  --tx:#1a2d3d;--tx2:#3a5470;--tx3:#6e8fa8;
  --shadow:0 1px 4px rgba(20,50,80,.10);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:20;margin:0 -12px;padding:10px 14px calc(10px - 0px);
  background:linear-gradient(135deg,#2b5ea7,#1d6fa5);color:#fff;display:flex;align-items:center;gap:10px}
.topbar .ttl{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:11px;opacity:.85}
.tbtn{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;
  padding:7px 10px;font-size:12px;min-height:32px;cursor:pointer}
.badge{font-size:10px;padding:3px 7px;border-radius:20px;background:rgba(255,255,255,.22)}

/* ── 步骤条 ── */
.stepbar{display:flex;gap:4px;margin:10px 0;padding:6px 0;overflow-x:auto;scrollbar-width:none}
.stepbar::-webkit-scrollbar{display:none}
.stp{flex:1;min-width:0;border:1px solid var(--border);background:var(--card);border-radius:9px;
  padding:7px 2px;font-size:11px;color:var(--tx3);text-align:center;cursor:pointer;line-height:1.3}
.stp b{display:block;font-size:12px;color:var(--tx2);font-weight:600}
.stp.done{background:var(--grn-d);border-color:rgba(11,123,80,.3);color:var(--grn)}
.stp.done b{color:var(--grn)}
.stp.cur{background:linear-gradient(135deg,#2b5ea7,#1d6fa5);border-color:#2b5ea7;color:#fff}
.stp.cur b{color:#fff}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--bg3)}
.card-ttl{font-size:13px;font-weight:700;color:var(--tx2);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.card-ttl .rt{margin-left:auto;font-size:11px;font-weight:400;color:var(--tx3)}
.note{font-size:11px;color:var(--tx3);line-height:1.65}
.note-w{font-size:12px;color:var(--yel);background:var(--yel-d);border:1px solid rgba(176,112,0,.25);
  border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.6}
.note-r{font-size:12px;color:var(--red);background:var(--red-d);border:1px solid rgba(185,50,50,.25);
  border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.6}
.note-g{font-size:12px;color:var(--grn);background:var(--grn-d);border:1px solid rgba(11,123,80,.25);
  border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}
.kv .v{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* 大数字卡 */
.bignum{text-align:center;padding:16px 10px;background:linear-gradient(135deg,#2b5ea7,#1d6fa5);
  color:#fff;border-radius:var(--r);margin:-2px}
.bignum .lab{font-size:12px;opacity:.85}
.bignum .val{font-size:30px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center}
.mini .m-lab{font-size:10px;color:var(--tx3)}
.mini .m-val{font-size:15px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}

/* ── 按钮 ── */
.btn{display:block;width:100%;border:1px solid var(--border);background:var(--card);color:var(--tx2);
  border-radius:11px;padding:13px 14px;font-size:15px;font-weight:600;cursor:pointer;min-height:48px}
.btn:active{transform:scale(.99)}
.btn.pri{background:linear-gradient(135deg,#2b5ea7,#1d6fa5);color:#fff;border-color:#2b5ea7}
.btn.grn{background:linear-gradient(135deg,#0e8f5f,#0b7b50);color:#fff;border-color:#0e8f5f}
.btn.warn{background:var(--yel-d);color:var(--yel);border-color:rgba(176,112,0,.3)}
.btn.ghost{background:transparent;border-color:var(--bdr2);color:var(--tx3);font-weight:400;font-size:14px}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:8px;margin:10px 0}
.btn-row .btn{flex:1;padding:11px 8px;font-size:14px}
.btn-sm{display:inline-block;width:auto;padding:7px 12px;font-size:12px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);color:var(--tx2);cursor:pointer;min-height:34px}
.btn-sm.pri{background:var(--acc);color:#fff;border-color:var(--acc)}

/* 悬浮主操作 */
.fab{position:fixed;right:calc(50% - 228px + 14px);bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  background:linear-gradient(135deg,#0e8f5f,#0b7b50);color:#fff;border:none;border-radius:26px;
  padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(11,123,80,.35);cursor:pointer}
.fab:disabled{opacity:.4}
@media(max-width:480px){.fab{right:16px}}

/* ── 折叠 ── */
details.fold{border:1px solid var(--border);border-radius:10px;background:var(--card);margin:8px 0;overflow:hidden}
details.fold>summary{list-style:none;padding:11px 12px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;
  display:flex;align-items:center;gap:6px;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .ar{margin-left:auto;color:var(--tx3);font-size:11px}
details.fold[open]>summary{border-bottom:1px solid var(--border);background:var(--bg3)}
details.fold .fold-body{padding:10px 12px}

/* ── 行卡（清单 / 结果） ── */
.rowcard{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:7px 0;background:var(--card)}
.rowcard .rc-top{display:flex;gap:8px;align-items:flex-start}
.rowcard .rc-name{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--tx);word-break:break-all}
.rowcard .rc-price{font-size:14px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.rowcard .rc-sub{font-size:11px;color:var(--tx3);margin-top:3px;line-height:1.6}
.rowcard .rc-subs{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:11px;color:var(--tx2);line-height:1.7}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;margin:1px 3px 1px 0;
  background:var(--bg4);color:var(--tx2);border:1px solid var(--border)}
.tag.g{background:var(--grn-d);color:var(--grn);border-color:rgba(11,123,80,.25)}
.tag.y{background:var(--yel-d);color:var(--yel);border-color:rgba(176,112,0,.25)}
.tag.r{background:var(--red-d);color:var(--red);border-color:rgba(185,50,50,.25)}

/* 手风琴（分部） */
.acc{border:1px solid var(--border);border-radius:10px;background:var(--card);margin:7px 0;overflow:hidden}
.acc>.acc-h{padding:11px 12px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;display:flex;gap:8px;min-height:44px;align-items:center}
.acc>.acc-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc>.acc-h .amt{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:700}
.acc>.acc-h .ar{color:var(--tx3);font-size:11px;transition:transform .2s}
.acc.open>.acc-h{background:var(--bg3)}
.acc.open>.acc-h .ar{transform:rotate(90deg)}
.acc>.acc-b{display:none;padding:8px 10px;border-top:1px solid var(--border)}
.acc.open>.acc-b{display:block}

/* ── Tab（询价三组） ── */
.tabs{display:flex;gap:5px;margin:10px 0 8px}
.tab{flex:1;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:8px 4px;
  font-size:12px;color:var(--tx3);text-align:center;cursor:pointer;min-height:40px}
.tab b{display:block;font-size:14px}
.tab.on{color:#fff;font-weight:600}
.tab.on.t-ok{background:var(--grn);border-color:var(--grn)}
.tab.on.t-warn{background:var(--yel);border-color:var(--yel)}
.tab.on.t-none{background:var(--red);border-color:var(--red)}

/* 询价卡片 */
.qcard{border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin:8px 0;background:var(--card);
  display:flex;gap:10px;align-items:flex-start}
.qcard.off{opacity:.6}
.qcard .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--bdr2);flex:0 0 auto;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;cursor:pointer;background:#fff}
.qcard .chk.on{background:var(--grn);border-color:var(--grn)}
.qcard .chk.dis{opacity:.35;pointer-events:none}
.qcard .qc-body{flex:1;min-width:0}
.qcard .qc-name{font-size:13px;font-weight:600;color:var(--tx);word-break:break-all}
.qcard .qc-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.qcard .qc-price{font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.qcard .qc-price .old{color:var(--tx3);text-decoration:line-through}
.qcard .qc-price .arrow{color:var(--tx3);margin:0 4px}
.qcard .qc-price .new{font-weight:700;color:var(--tx2)}
.qcard .qc-price .new.chg{color:var(--acc)}
.qcard .qc-st{font-size:11px;margin-top:4px;line-height:1.6}
.qcard .qc-warn{font-size:11px;color:var(--red);margin-top:3px}
.qcard .qc-warn2{font-size:11px;color:var(--yel);margin-top:3px}
.qcard .qc-pick{margin-top:6px;width:100%;font-size:12px;padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--tx2)}

/* ── 进度 ── */
.prog{height:8px;background:var(--bg4);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2b5ea7,#0e8f5f);transition:width .25s}
.prog-txt{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3)}

/* ── 表单 ── */
.fld{margin:9px 0}
.fld label{display:block;font-size:12px;color:var(--tx3);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
  font-size:15px;background:#fff;color:var(--tx);min-height:44px}
.fld input:focus,.fld select:focus{outline:2px solid var(--acc-d);border-color:var(--acc)}

/* ── 底部抽屉 / 全屏遮罩 ── */
.mask{position:fixed;inset:0;background:rgba(15,35,55,.42);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.mask.center{align-items:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:16px 16px 0 0;
  padding:6px 14px calc(16px + env(safe-area-inset-bottom));max-height:78vh;overflow-y:auto;
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .grip{width:36px;height:4px;border-radius:4px;background:var(--bdr2);margin:6px auto 10px}
.sheet .sh-ttl{font-size:15px;font-weight:700;color:var(--tx);margin:0 0 8px}
.sheet .sh-opts{margin:0 -4px}
.sh-opt{padding:12px 10px;border-bottom:1px solid var(--border);font-size:14px;color:var(--tx2);cursor:pointer;min-height:46px}
.sh-opt:last-child{border-bottom:none}
.sh-opt.sel{color:var(--acc);font-weight:700;background:var(--acc-d);border-radius:8px}
.sh-opt small{display:block;font-size:11px;color:var(--tx3);font-weight:400;margin-top:2px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(26,45,61,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:22px;z-index:99;
  max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.5}
#toast.on{opacity:1}

.empty{padding:28px 14px;text-align:center;color:var(--tx3);font-size:13px;line-height:1.7}
.ro-banner{background:var(--yel-d);border:1px solid rgba(176,112,0,.3);color:var(--yel);
  border-radius:10px;padding:9px 12px;font-size:12px;margin:10px 0;line-height:1.6}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bdr2);border-top-color:var(--acc);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">

  <!-- ══ 登录 ══ -->
  <section class="view" id="v-login">
    <div class="topbar"><span class="ttl">🏠 装修套价 · 手机版</span></div>
    <div class="card" style="margin-top:22px">
      <div class="card-ttl">🔐 登录</div>
      <div class="fld"><label>邮箱</label><input id="lgEmail" type="email" autocomplete="username" placeholder="you@example.com"></div>
      <div class="fld"><label>密码</label><input id="lgPwd" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="btn-row"><button class="btn pri" id="lgBtn" onclick="doLogin()">登录</button></div>
      <div class="note">登录状态与电脑端 <b>tool.html</b> 同源互通：一端登录，另一端免登。<br>
      手机版与电脑端共用同一份<b>云端草稿</b>——电脑套到一半，手机接着看。</div>
    </div>
    <div class="note" style="text-align:center;margin-top:14px">过程性调节（改子目 / 调系数 / 费率）请在电脑端完成</div>
  </section>

  <!-- ══ 首页：草稿接力 + 历史方案 ══ -->
  <section class="view" id="v-home">
    <div class="topbar">
      <span class="ttl" id="homeTtl">📱 套价工具</span>
      <span class="badge" id="beBadge">检测中…</span>
      <button class="tbtn" onclick="doLogout()">退出</button>
    </div>
    <div id="homeBody"></div>
  </section>

  <!-- ══ 五步流程 ══ -->
  <section class="view" id="v-flow">
    <div class="topbar">
      <button class="tbtn" onclick="goHome()">‹ 项目</button>
      <span class="ttl" id="flowTtl">未命名项目</span>
      <button class="tbtn" onclick="saveAsPlan()">💾</button>
    </div>
    <div class="stepbar" id="stepbar"></div>
    <div id="roBanner" class="ro-banner hidden"></div>

    <!-- ① 导入清单 -->
    <div class="step-panel" id="p-import">
      <div class="card">
        <div class="card-ttl">① 导入清单<span class="rt">Excel / BOQ</span></div>
        <button class="btn pri" onclick="pickBoq()">📂 选择 Excel 文件</button>
        <div class="note" style="margin-top:8px">iPhone 走「文件」App；微信收到的文件请点「用其他应用打开 → 存储到文件」后再选。</div>
      </div>
      <div id="impResult"></div>
    </div>

    <!-- ② AI 套价 -->
    <div class="step-panel hidden" id="p-ai">
      <div class="card" id="aiCard"></div>
      <div id="aiResult"></div>
    </div>

    <!-- ③ 导入主材询价 -->
    <div class="step-panel hidden" id="p-quote">
      <div class="card" id="qtCard"></div>
      <div id="qtResult"></div>
    </div>

    <!-- ④ 结果总览 -->
    <div class="step-panel hidden" id="p-result"><div id="rsBody"></div></div>

    <!-- ⑤ 导出 -->
    <div class="step-panel hidden" id="p-export">
      <div class="card" id="exCard"></div>
      <div id="exResult"></div>
    </div>
  </section>

</div>

<input type="file" id="boqFile" accept=".xlsx,.xls" class="hidden">
<input type="file" id="quoteFile" accept=".xlsx,.xls" class="hidden">
<input type="file" id="tmplFile" accept=".xlsx,.xls" class="hidden">
<div id="sheetHost"></div>
<div id="toast"></div>

<script>
/* ══════════════════════════ 配置 ══════════════════════════ */
// 数据链路：线上走同源反代 /sb（Pages Function → Supabase）——部分用户网络直连 *.supabase.co 会被干扰（实测需 VPN 才通）；
// localhost 保持直连，本机 http.server 没有函数运行时，开发路径零变化。回归：docs/superpowers/tests/sb_proxy_test.js
const SUPABASE_DIRECT = 'https://lnvtykghcpsjpwczbqsm.supabase.co';
const SUPABASE_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? SUPABASE_DIRECT : location.origin + '/sb';

const SUPABASE_ANON_KEY = 'sb_publishable_VQNxLrsKEZuZDeAGa7xOAg__SUeFH_Q';
const IS_LOCAL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
// 后端地址：默认按环境推断（localhost → 本机 8000；线上 → Render）。
// 手机/平板用局域网 IP 访问时，页面不在 localhost，默认会打到生产 Render；
// 需要连自己电脑上的本地后端时，地址后加 ?backend=http://<电脑IP>:8000（只存本浏览器，?backend=off 清除）。
const BACKEND_URL = (function () {
  try {
    const q = new URLSearchParams(location.search).get('backend');
    if (q === 'off' || q === 'reset') { localStorage.removeItem('m_backend'); return IS_LOCAL ? 'http://localhost:8000' : 'https://decoration-pricing-system.onrender.com'; }
    if (q) localStorage.setItem('m_backend', q.trim());
    const saved = (localStorage.getItem('m_backend') || '').replace(/\/+$/, '');
    if (saved) return saved;
  } catch (e) {}
  return IS_LOCAL ? 'http://localhost:8000' : 'https://decoration-pricing-system.onrender.com';
})();
const BACKEND_IS_LOCAL_LAN = /^https?:\/\/(localhost|127\.0\.0\.1|192\.168\.|172\.20\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[01]\.|10\.)/.test(BACKEND_URL);
let _backendOk = false;

/* ══════════════════════════ 小工具 ══════════════════════════ */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// 后端错误体解析（P0-3，与 tool.html:beErrMsg 同源同形）：优先 message/error/detail 字段，
// 纯文本兜底。配合导出端点 500 统一体 {"error":"export_failed","message":…}，不再把原始 JSON 上屏。
async function beErrMsg(resp, fallback) {
  const fb = fallback || ('HTTP ' + resp.status);
  try {
    const t = await resp.text();
    if (!t) return fb;
    try {
      const j = JSON.parse(t);
      if (j && typeof j.message === 'string' && j.message) return j.message;
      if (j && typeof j.error === 'string' && j.error) return j.error;
      if (j && typeof j.detail === 'string' && j.detail) return j.detail;
      if (j && j.detail) return JSON.stringify(j.detail);
    } catch (_) { /* 非 JSON → 原文兜底 */ }
    return t;
  } catch (_) { return fb; }
}
function fmt(v, dec) { dec = (dec === undefined ? 2 : dec); return (v === null || v === undefined) ? '—' : Number(v).toLocaleString('zh-CN', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }
function fmtRate(v) { const n = Math.round((parseFloat(v) || 0) * 100) / 100; return String(n); }
function normKey(s) { return String(s || '').replace(/\s/g,'').replace(/[（）()【】\[\]]/g,'').toLowerCase(); }
function countHit(hay, needle) { return (!hay || !needle) ? 0 : hay.split(needle).length - 1; }
function colLetter(i) { let s = ''; i = i + 1; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
let _toastT = null;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(_toastT); _toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

/* ══════════════════════════ Supabase 数据层（与 tool.html 同契约） ══════════════════════════ */
const _h = () => { const h = {'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY}; const t = localStorage.getItem('sb-access-token'); if (t) h['Authorization'] = 'Bearer ' + t; return h; };
async function _get(t, p) {
  let c, tm;
  try {
    const q = new URLSearchParams();
    q.set('select', (p && p.select) || '*');
    if (p && p.eq) q.set(p.eq.col, 'eq.' + encodeURIComponent(p.eq.val));
    if (p && p.order) q.set('order', p.order.col + (p.order.asc ? '.asc' : '.desc'));
    if (p && p.limit) q.set('limit', '' + p.limit);
    c = new AbortController(); tm = setTimeout(() => c.abort(), 12000);
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + t + '?' + q, {headers: _h(), signal: c.signal});
    clearTimeout(tm);
    if (!r.ok) {
      const txt = await r.text();
      if (txt.includes('JWT expired')) { localStorage.removeItem('sb-access-token'); localStorage.removeItem('sb-refresh-token'); if (!IS_LOCAL) showView('login'); }
      return [];
    }
    return await r.json();
  } catch (e) { clearTimeout(tm); return []; }
}
async function _post(t, b) { const h = _h(); h['Prefer'] = 'return=minimal'; const r = await fetch(SUPABASE_URL + '/rest/v1/' + t, {method:'POST', headers:h, body: JSON.stringify(b)}); return r.ok; }
async function _patch(t, id, b) { const h = _h(); h['Prefer'] = 'return=minimal'; const r = await fetch(SUPABASE_URL + '/rest/v1/' + t + '?id=eq.' + id, {method:'PATCH', headers:h, body: JSON.stringify(b)}); return r.ok; }

let CURRENT_USER = JSON.parse(localStorage.getItem('sb-user') || 'null');
async function refreshSession() {
  const rt = localStorage.getItem('sb-refresh-token');
  if (!rt) return;
  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: {'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify({refresh_token: rt})
    });
    if (r.ok) {
      const d = await r.json();
      localStorage.setItem('sb-access-token', d.access_token);
      localStorage.setItem('sb-refresh-token', d.refresh_token);
      localStorage.setItem('sb-user', JSON.stringify(d.user));
      CURRENT_USER = d.user;
    }
  } catch (e) {}
}
async function doLogin() {
  const email = $('lgEmail').value.trim(), pwd = $('lgPwd').value;
  if (!email || !pwd) { toast('请输入邮箱和密码'); return; }
  $('lgBtn').disabled = true; $('lgBtn').textContent = '登录中…';
  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: {'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify({email: email, password: pwd})
    });
    const txt = await r.text(); let d = {};
    try { d = txt ? JSON.parse(txt) : {}; } catch (e) {}
    if (!r.ok) throw new Error(d.error_description || d.msg || ('HTTP ' + r.status));
    localStorage.setItem('sb-access-token', d.access_token);
    localStorage.setItem('sb-refresh-token', d.refresh_token);
    localStorage.setItem('sb-user', JSON.stringify(d.user));
    CURRENT_USER = d.user;
    toast('✓ 已登录');
    await bootData(); renderHome(); showView('home');
  } catch (e) {
    // fetch 本身抛 TypeError = 请求根本没到达 Supabase（断网 / 域名被拦截 / 代理未开），与账号密码无关
    toast('❌ 登录失败：' + (e instanceof TypeError ? '连不上 Supabase 服务器（网络或代理问题），本机可先用离线模式' : e.message));
  }
  finally { $('lgBtn').disabled = false; $('lgBtn').textContent = '登录'; }
}
function doLogout() {
  localStorage.removeItem('sb-access-token'); localStorage.removeItem('sb-refresh-token'); localStorage.removeItem('sb-user');
  CURRENT_USER = null; toast('已退出'); renderHome(); showView('home');
}

function bumpUidFrom(gs) {
  let maxId = 0;
  (gs || []).forEach(g => { maxId = Math.max(maxId, g.id || 0); (g.sections || []).forEach(s => { maxId = Math.max(maxId, s.id || 0); (s.rows || []).forEach(r => { maxId = Math.max(maxId, r.id || 0); (r.subs || []).forEach(sb => { if (typeof sb.id === 'number') maxId = Math.max(maxId, sb.id); }); }); }); });

function buildDB(items, wrMap) {
  DB = {};

    if (!DB[it.trade_team]) DB[it.trade_team] = [];
    const wr = it.waste_rate != null ? parseFloat(it.waste_rate) : (wrMap && wrMap[it.internal_code] != null ? parseFloat(wrMap[it.internal_code]) : undefined);
    DB[it.trade_team].push({id: it.internal_code, trade: it.work_type || '', name: it.item_name, spec: it.spec || '',
      unit: it.unit, price: parseFloat(it.unit_price), remark: it.remark || '',
      auxType: it.aux_rule_type || '', auxFixedK: parseFloat(it.aux_fixed_k) || 0, auxRateDetail: it.aux_rate_detail || null, waste_rate: wr});
  });
  ALL = [];
  Object.keys(DB).forEach(sh => (DB[sh] || []).forEach(it => ALL.push(Object.assign({}, it, {sheet: sh}))));
  SHEETS = Object.keys(DB);
  rebuildBenchMap();
}
function rebuildBenchMap() { benchMap = {}; Object.keys(DB).forEach(sh => DB[sh].forEach(i => { benchMap[sh + '|' + i.id] = Object.assign({}, i, {sheet: sh}); })); }
function getBench(id, sh) { return benchMap[sh + '|' + id] || null; }

/* ══════════════════════════ 计价引擎（契约与 tool.html 一致） ══════════════════════════ */
function effPrice(sub) { const it = getBench(sub.bid, sub.bsh); return it ? it.price * sub.coef * globalCoef * (sub.conv || 1.0) : 0; }
function rowUnitPrice(r) { if (r.hourlyMode) return hourlyRate; if (!r.subs || !r.subs.length) return null; return r.subs.reduce((s, sub) => s + effPrice(sub), 0); }
// 行主材费（单价级，含损耗+单位换算）：Σ 子目[matPrice×(1+损耗率)×coef×conv]
function rowMatCost(r) {
  if (!r.subs || !r.subs.length) return 0;
  return r.subs.reduce((sum, sub) => {
    const smp = parseFloat(sub.matPrice) || 0, swr = parseFloat(sub.wasteRate) || 0;
    const cf = parseFloat(sub.coef) || 1.0, cv = parseFloat(sub.conv) || 1.0;
    return sum + smp * (1 + swr / 100) * cf * cv;
  }, 0);
}
function compUnitPrice(r) { const lab = rowUnitPrice(r) || 0; return lab + rowMatCost(r) + (parseFloat(r.auxCost) || 0) + lab * (globalMgmtRate / 100) + lab * (globalProfitRate / 100); }
// 手机端差异（有意为之）：工程量缺失时桌面端会得到 NaN，会让总合价整卡变成 NaN，这里按 0 处理；其余口径与 tool.html 完全一致
function rowTotal(r) {
  const p = rowUnitPrice(r), q = parseFloat(r.qty);
  if (p === null || isNaN(q)) return rowMatCost(r) * (parseFloat(r.qty) || 0) + (parseFloat(r.auxCost) || 0) * (parseFloat(r.qty) || 0);
  return p * q + rowMatCost(r) * q + (parseFloat(r.auxCost) || 0) * q + p * globalMgmtRate / 100 * q + p * globalProfitRate / 100 * q;
}
function effRowMatPrice(r) {
  const subs = r.subs || [];
  if (subs.length) return subs.reduce((s, x) => s + (parseFloat(x.matPrice) || 0) * (parseFloat(x.coef) || 1.0) * (parseFloat(x.conv) || 1.0), 0);
  return parseFloat(r.matPrice) || 0;
}
function rowWasteInfo(r) {
  const subs = r.subs || []; if (!subs.length) return null;
  const prices = subs.reduce((s, x) => s + (parseFloat(x.matPrice) || 0) * (parseFloat(x.coef) || 1.0) * (parseFloat(x.conv) || 1.0), 0);
  const rates = subs.map(x => parseFloat(x.wasteRate) || 0);
  const same = rates.every(v => Math.abs(v - rates[0]) < 1e-9);
  const eff = prices > 0 ? (rowMatCost(r) / prices - 1) * 100 : (same ? rates[0] : null);
  return {eff: eff, same: same, rates: rates, n: subs.length, prices: prices};
}
function effRowWaste(r) { const w = rowWasteInfo(r); return (w && w.eff !== null) ? Math.round(w.eff * 100) / 100 : 0; }
function getMaterialPrice(name) {
  if (userPriceOverrides[name] !== undefined && userPriceOverrides[name] !== '') return parseFloat(userPriceOverrides[name]);
  if (priceLib[name]) return priceLib[name].price;
  return 0;
}
function computeAuxForSub(sub) {
  const bench = getBench(sub.bid, sub.bsh);
  if (!bench || !bench.auxType) return 0;
  let total = bench.auxFixedK || 0;
  const rd = bench.auxRateDetail;
  if (rd && rd.type === 'RATE') total += getMaterialPrice(rd.materialName) * (rd.consume || 0);
  else if (rd && rd.type === 'GROUP') (rd.items || []).forEach(it => { total += getMaterialPrice(it.name) * (it.consume || 0); });
  return total;
}
function computeAuxForRow(r) { if (!r || !r.subs || !r.subs.length) return 0; return r.subs.reduce((s, sub) => s + computeAuxForSub(sub), 0); }
function recomputeAllAux() { getAllRows().forEach(r => { r.auxCost = computeAuxForRow(r); }); }
function rowDirectCost(r) { return (rowUnitPrice(r) || 0) + rowMatCost(r) + (parseFloat(r.auxCost) || 0); }
function totalDirectCost() { return getAllRows().reduce((s, r) => s + rowDirectCost(r) * (parseFloat(r.qty) || 0), 0); }
function calcTotals() {
  const t = {lab:0, mat:0, aux:0, mgmt:0, profit:0, total:0};
  getAllRows().forEach(r => {
    const q = parseFloat(r.qty) || 0, lab = rowUnitPrice(r) || 0;
    t.lab += lab * q; t.mat += rowMatCost(r) * q; t.aux += (parseFloat(r.auxCost) || 0) * q;
    t.mgmt += lab * globalMgmtRate / 100 * q; t.profit += lab * globalProfitRate / 100 * q;
    t.total += rowTotal(r);
  });
  return t;
}

<script>

const MAT_CAT_KEYWORDS = {

  '卫浴五金':          ['洁具','马桶','坐便器','洗手盆','台盆','龙头','花洒','五金','地漏','浴室柜','小便器'],

  '照明设备':          ['灯具','灯带','筒灯','射灯','灯槽','轨道灯','吊灯','壁灯','LED','灯膜'],

  '厨房设备':          ['厨房','橱柜','灶','水槽','烟机','冰箱柜','消毒柜'],
  '石膏制品':          ['石膏','GRG','GRC','石膏线'],
  '木饰面/木门/柜体':  ['木饰面','木门','衣柜','鞋柜','电视柜','书柜','柜体','中岛','地台','护墙板','木作','家政柜'],
  '塑胶地板':          ['塑胶地板','PVC地板','橡胶地板','LVT','石塑地板'],
  '亚克力':            ['亚克力','有机玻璃'],
  '成品隔断':          ['隔断','抗倍特','小便挡板','成品隔断'],
  '架空地板':          ['架空地板','网络地板','防静电地板','OA地板'],
  '户外木地板':        ['户外木地板','户外木','防腐木','塑木','木塑','炭化木'],
};
function subCategoryScore(sub, cat) {
  const kws = MAT_CAT_KEYWORDS[cat]; if (!kws) return 0;
  const it = getBench(sub.bid, sub.bsh);
  const t = normKey(((it && it.name) || '') + ' ' + (sub.matName || ''));
  let s = 0; kws.forEach(k => { const nk = normKey(k); if (nk && t.indexOf(nk) >= 0) s += nk.length; });
  return s;
}
// 未套价→行级暂存；已套价→按品类落到「同品类且空缺」的子目
function routeRowMat(r, price, cat, mode) {
  const subs = r.subs || [];
  const over = mode === 'over';
  if (!subs.length) {
    if (!over && (parseFloat(r.matPrice) || 0) > 0) return 'kept';
    r.matPrice = price;
    if (cat && !(r.matName || '').trim()) r.matName = cat;
    return 'staged';
  }
  // F3 gtype 隔离护栏（镜像 tool.html 同名护栏）：行内只要有任一条集团子目，整行不落点、原值不动。
  // 集团口径主材价只认 mats[].price（null=甲供待询价），行级报价写进子目 matPrice 会静默无效，
  // 又被内部 rowMatCost 读到 → 与内部口径双计。
  if (subs.some(s => s && s.gtype === 'group')) return 'kept';
  if (cat && MAT_CAT_KEYWORDS[cat]) {
    const cands = subs.map(s => ({s: s, sc: subCategoryScore(s, cat)})).filter(x => x.sc > 0);
    if (cands.length) {
      const priced = cands.find(x => (parseFloat(x.s.matPrice) || 0) > 0);
      if (priced && !over) return 'kept';
      const empty = cands.find(x => (parseFloat(x.s.matPrice) || 0) === 0);
      const target = empty || (over ? cands[0] : null);
      if (target) { target.s.matPrice = price; if (!(r.matName || '').trim()) r.matName = cat; return 'assigned'; }
      return 'kept';
    }
  }
  if (subs.length === 1) {
    if (!over && (parseFloat(subs[0].matPrice) || 0) > 0) return 'kept';

async function handleBoqFile(e) {

// 与 tool.html processFile() 同规则：扫前 10 行找表头 → 列映射 → 无单位无工程量的行视为分部标题
function parseBoqWorkbook(wb) {
  const newGroups = [];
  let totalN = 0, totalSkip = 0, sheetsOk = 0;
  wb.SheetNames.forEach(sheetName => {
    const ws = wb.Sheets[sheetName];
    const data = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});
    if (data.length < 2) return;
    let hdrRow = -1; const cm = {};
    for (let ri = 0; ri < Math.min(10, data.length); ri++) {
      if (!data[ri].some(h => /项目名称/.test(String(h || '')))) continue;
      hdrRow = ri;
      data[ri].forEach((h, i) => {
        const s = String(h || '').replace(/[\s\n\r]/g, '');
        if (/项目名称/.test(s) && cm.name === undefined) cm.name = i;
        if (/项目特征/.test(s) && cm.spec === undefined) cm.spec = i;
        if (/计量单位|单位/.test(s) && cm.unit === undefined) cm.unit = i;
        if (/备注/.test(s) && cm.remark === undefined) cm.remark = i;
      });
      break;
    }
    if (hdrRow < 0) return;
    let qtyCol = -1;
    for (let ri = hdrRow; ri <= Math.min(hdrRow + 1, data.length - 1); ri++) {
      data[ri].forEach((h, i) => { if (/^工程量$|^数量$/.test(String(h || '').trim()) && qtyCol === -1) qtyCol = i; });
      if (qtyCol >= 0) break;
    }
    if (qtyCol === -1) data[hdrRow].forEach((h, i) => { const s = String(h || '').trim(); if (/工程量|数量/.test(s) && s.length < 10 && qtyCol === -1) qtyCol = i; });
    sheetsOk++;
    const group = {id: uid++, sheetName: sheetName, open: true, sections: []};
    let curSec = {id: uid++, name: '其他', open: true, rows: []};
    for (let i = hdrRow + 1; i < data.length; i++) {
      const row = data[i];
      const name = cm.name !== undefined ? String(row[cm.name] || '').replace(/\n/g, ' ').trim() : '';
      if (!name) continue;
      const unit = cm.unit !== undefined ? String(row[cm.unit] || '').trim() : '';
      const qty = qtyCol >= 0 ? row[qtyCol] : '';
      const hasData = unit || (qty !== '' && qty !== null && qty !== undefined);
      if (!hasData) {
        if (curSec.rows.length > 0) group.sections.push(curSec);
        curSec = {id: uid++, name: name, open: true, rows: []};
        totalSkip++; continue;
      }
      curSec.rows.push(makeRow({name: name, unit: unit,
        spec: cm.spec !== undefined ? String(row[cm.spec] || '').replace(/\n/g, ' ').trim() : '',
        qty: (qty !== '' && qty !== null && qty !== undefined) ? String(qty) : '',
        remark: (cm.remark !== undefined ? String(row[cm.remark] || '').trim() : '')}));

}

function setQuoteTab(t) { _quoteTab = t; $('qtResult').innerHTML = renderQuoteList(); }

function applyQuote() {
  const targets = _quoteItems.filter(it => it.checked && it.match.row);
  if (!targets.length) { toast('没有勾选可导入的行'); return; }
  if (_quoteTax === 'in') { toast('⚠️ 含税口径：系统不自动换算，建议先在 Excel 里换算为不含税价'); }
  const done = {};
  let assigned = 0, staged = 0, pending = 0, kept = 0, dup = 0;
  targets.forEach(it => {
    const r = it.match.row;
    if (done[r.id]) { dup++; return; }
    done[r.id] = 1;
    const st = routeRowMat(r, it.price, _quoteCat, _quoteMode);
    if (st === 'assigned') assigned++;
    else if (st === 'staged') staged++;
    else if (st === 'pending') pending++;
    else kept++;

  _quoteSheets = []; _quoteItems = []; _quoteMatched = false; _quoteProf = [];
  saveDraft({notify: false});
  renderQuote(); updateStepbar();
  toast('✓ 套入子目 ' + assigned + (staged ? ' · 暂存待套价 ' + staged : '') + (pending ? ' · 多子目待分配 ' + pending : '') + (kept ? ' · 原值未动 ' + kept : '') + (dup ? ' · 同行重复 ' + dup : ''));
  if (pending) setTimeout(() => confirmSheet('多子目待分配', '有 <b>' + pending + '</b> 行挂了多个子目且认不出品类，价格只能暂存在清单行上，<b>不进成本</b>。<br>请在电脑端把价分到具体子目。', '知道了', () => {}, false), 600);
}

function setExTab(t) { exTab = t; renderExport(); }
function renderTmplInfo() {
  const el = $('tmplInfo'); if (!el) return;
  if (!tmplHeaders.length) { el.innerHTML = ''; return; }
  const mapped = Object.keys(tmplMapping).length;
  el.innerHTML = '<div class="note-g" style="margin-top:8px">✓ 表头行 = 第 ' + (tmplHeaderRow + 1) + ' 行 · 已自动映射 ' + mapped + ' 列<br>'
    + tmplHeaders.filter(h => h.label && tmplMapping[h.col]).map(h => colLetter(h.col) + '「' + esc(h.label) + '」→ ' + esc(TMPL_FIELDS.find(f => f.key === tmplMapping[h.col]).label)).join('<br>')
    + '<br>需要微调映射请回电脑端。</div>';
}
$('tmplFile') && $('tmplFile').addEventListener('change', handleTmplFile);
function pickTmpl() { $('tmplFile').click(); }
const TMPL_FIELDS = [
  {key: 'seq', label: '序号', patterns: ['序号','项次','NO','编号']},
  {key: 'code', label: '定额编号', patterns: ['定额编号','编码','定额号','清单编码']},
  {key: 'name', label: '项目名称', patterns: ['项目名称','名称','清单项目名称','项目']},
  {key: 'spec', label: '项目特征', patterns: ['项目特征','特征描述','规格','特征']},
  {key: 'unit', label: '单位', patterns: ['单位','计量单位','计价单位']},
  {key: 'qty', label: '工程量', patterns: ['工程量','数量','工程数量']},
  {key: 'lab', label: '人工单价', patterns: ['人工单价','人工费','劳务单价','基准单价']},
  {key: 'mat_price', label: '主材单价', patterns: ['主材单价','材料单价']},
  {key: 'mat', label: '主材费', patterns: ['主材费','材料费']},
  {key: 'waste', label: '主材损耗率', patterns: ['主材损耗率','损耗率','损耗','材料损耗']},
  {key: 'aux', label: '辅材费', patterns: ['辅材费','辅材']},
  {key: 'mgmt', label: '管理费', patterns: ['管理费','管理','企业管理费']},
  {key: 'profit', label: '利润', patterns: ['利润','利润额']},
  {key: 'usp', label: '综合单价', patterns: ['综合单价','定额单价','全费用单价','单价']},
  {key: 'total', label: '合价', patterns: ['合价','总价','金额','定额合价']},
  {key: 'remark', label: '备注', patterns: ['备注','说明','注释']},
];
async function handleTmplFile(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  tmplName = file.name;
  const data = await file.arrayBuffer();
  tmplFileData = data;
  try {
    const wb = XLSX.read(data, {type: 'array', cellStyles: true, cellFormula: false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    let bestRow = -1, bestScore = 0;
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    for (let r = range.s.r; r <= Math.min(range.s.r + 10, range.e.r); r++) {
      let score = 0;
      for (let c = range.s.c; c <= range.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({r: r, c: c})];
        if (!cell || !cell.v) continue;
        const v = String(cell.v).trim();
        for (const f of TMPL_FIELDS) { if (f.patterns.some(p => v.includes(p))) { score++; break; } }
      }
      if (score > bestScore) { bestScore = score; bestRow = r; }
    }
    if (bestRow < 0) { toast('未识别到表头行，请换个模板或回电脑端'); tmplFileData = null; renderExport(); return; }
    tmplHeaderRow = bestRow;
    tmplHeaders = [];
    for (let c = range.s.c; c <= range.e.c; c++) { const cell = ws[XLSX.utils.encode_cell({r: bestRow, c: c})]; tmplHeaders.push({col: c, label: cell ? String(cell.v || '').trim() : ''}); }
    tmplMapping = {};
    tmplHeaders.forEach(h => { if (!h.label) return; for (const f of TMPL_FIELDS) { if (f.patterns.some(p => h.label.includes(p))) { tmplMapping[h.col] = f.key; break; } } });
    renderExport();
  } catch (e) { toast('模板解析失败：' + e.message); }
}
async function doConfigExport() {
  const btn = $('exBtn'); if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
  try {
    const payload = collectExportData();
    const resp = await fetch(BACKEND_URL + '/api/v1/export/excel', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
    if (!resp.ok) throw new Error(await beErrMsg(resp));
    await shareOrDownload(await resp.blob(), payload.project_name + '_套价结果.xlsx');
  } catch (e) { toast('❌ 导出失败：' + String(e.message).substring(0, 120)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '📤 生成并分享 Excel'; } }
}
async function doTemplateExport() {
  if (!tmplFileData) { toast('请先选择模板'); return; }
  if (!Object.keys(tmplMapping).length) { toast('没识别到可映射的列'); return; }
  const btn = $('exBtn'); if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
  try {
    const payload = collectExportData();
    payload.header_row = tmplHeaderRow;
    payload.column_mapping = tmplMapping;
    payload.show_subs = false;
    payload.use_formula = true;
    payload.group_folding = true;
    const fd = new FormData();
    fd.append('template', new Blob([tmplFileData], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'template.xlsx');
    fd.append('data', JSON.stringify(payload));
    const resp = await fetch(BACKEND_URL + '/api/v1/export/template', {method: 'POST', body: fd});
    if (!resp.ok) throw new Error(await beErrMsg(resp));
    await shareOrDownload(await resp.blob(), payload.project_name + '_报价单.xlsx');
  } catch (e) { toast('❌ 导出失败：' + String(e.message).substring(0, 120)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '📤 填入并分享'; } }
}
async function shareOrDownload(blob, filename) {
  try {
    const file = new File([blob], filename, {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: filename});
      toast('✓ 已唤起分享'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') { toast('已取消分享'); return; } }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已下载 · 如未弹出请检查下载文件夹');
}
</script>
<script>
/* ══════════════════════════ 首页：项目入口（草稿接力 + 历史方案） ══════════════════════════ */
async function renderHome() {
  const box = $('homeBody');
  box.innerHTML = '<div class="empty"><span class="spin"></span> 加载云端项目…</div>';
  if (!CURRENT_USER || !CURRENT_USER.id) {
    box.innerHTML = '<div class="card"><div class="card-ttl">本地离线模式</div>'
      + '<div class="note">localhost 免登录，数据只存在本浏览器。需要跨端接力请登录后使用云端草稿。</div>'
      + '<button class="btn pri" style="margin-top:10px" onclick="newProject()">➕ 新建项目</button>'
      + '<button class="btn ghost" style="margin-top:8px" onclick="showView(\'login\')">去登录</button></div>';
    return;
  }
  const h = _h();
  let draft = null, plans = [];
  try {
    const r1 = await fetch(SUPABASE_URL + '/rest/v1/projects?user_id=eq.' + CURRENT_USER.id + '&is_draft=eq.true&order=created_at.desc&select=id,name,row_count,priced_count,created_at&limit=1', {headers: h});
    const d = await r1.json().catch(() => []);
    draft = d && d[0];
    const r2 = await fetch(SUPABASE_URL + '/rest/v1/projects?user_id=eq.' + CURRENT_USER.id + '&is_draft=eq.false&order=created_at.desc&select=id,name,row_count,priced_count,created_at&limit=20', {headers: h});
    plans = await r2.json().catch(() => []);
  } catch (e) {}
  let html = '';
  if (draft) {
    html += '<div class="card" style="border-color:var(--acc);box-shadow:0 2px 10px rgba(29,111,165,.16)">'
      + '<div class="card-ttl">📝 云端草稿<span class="rt">手机 / 电脑共用</span></div>'
      + '<div class="kv"><span class="k">项目</span><span class="v">' + esc(draft.name) + '</span></div>'
      + '<div class="kv"><span class="k">进度</span><span class="v">清单 ' + (draft.row_count || 0) + ' · 已套价 ' + (draft.priced_count || 0) + '</span></div>'
      + '<div class="kv"><span class="k">保存于</span><span class="v">' + fmtDraftTime(draft.created_at) + '</span></div>'
      + '<div class="note" style="margin-top:6px">⚠️ 可能在其他设备修改过，打开后若有更新会提醒。</div>'
      + '<div class="btn-row"><button class="btn ghost" onclick="dropDraft()">舍弃</button><button class="btn pri" onclick="loadDraft()">继续 →</button></div></div>';
  }
  html += '<div class="btn-row"><button class="btn grn" onclick="newProject()">➕ 新建项目（导入 Excel）</button></div>';
  html += '<div class="card-ttl" style="margin-top:14px">📂 历史方案<span class="rt">只读</span></div>';
  if (!plans.length) html += '<div class="empty">还没有已保存的方案<br>在⑤导出前可用顶部 💾 另存为方案</div>';
  else html += plans.map(p => '<div class="rowcard" onclick="openPlan(' + p.id + ')"><div class="rc-top"><span class="rc-name">' + esc(p.name) + '</span><span class="rc-price">¥ 看看</span></div>'
    + '<div class="rc-sub">' + fmtDraftTime(p.created_at) + ' · 清单 ' + (p.row_count || 0) + ' 条 · 已套价 ' + (p.priced_count || 0) + ' 条</div></div>').join('');
  html += '<div class="note" style="margin:14px 0">手机版：全过程可走，但只呈现结果。子目增删改、费率调整、对内金额请在电脑端完成。<br>基准价 ' + ALL.length + ' 条' + (priceLibMonth ? ' · 信息价 ' + priceLibMonth : '') + '。</div>';
  box.innerHTML = html;
}
async function dropDraft() {
  confirmSheet('舍弃草稿', '云端草稿将被删除，不可恢复。已保存的正式方案不受影响。', '删除', async () => {
    const h = _h();
    await fetch(SUPABASE_URL + '/rest/v1/projects?user_id=eq.' + CURRENT_USER.id + '&is_draft=eq.true', {method: 'DELETE', headers: Object.assign({}, h, {Prefer: 'return=minimal'})});
    _draftId = null; _draftCreatedAt = null;
    toast('已删除'); renderHome();
  }, true);
}
async function openPlan(id) {
  const rows = await _get('projects', {eq: {col: 'id', val: id}});
  const snap = rows && rows[0];
  if (!snap) { toast('方案不存在'); return; }
  applySnapshot(snap);
  _draftId = null; _draftCreatedAt = null;
  readOnly = true;
  enterFlow(snap.name);
}
async function saveAsPlan() {
  if (!getAllRows().length) { toast('没有数据'); return; }
  if (!CURRENT_USER || !CURRENT_USER.id) { toast('未登录，无法保存方案'); return; }
  openSheet('<div class="sh-ttl">另存为方案</div><div class="fld"><input id="shPlanName" value="' + esc(projName) + '"></div>'
    + '<div class="note">方案为正式存档（is_draft=false）；云端草稿仍会保留，方便继续编辑。</div>'
    + '<div class="btn-row"><button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn pri" id="shOk">保存</button></div>');
  $('shOk').onclick = async () => {
    const nm = $('shPlanName').value.trim() || projName;
    closeSheet();
    projName = nm; $('flowTtl').textContent = nm;
    const payload = buildDraftPayload(false);
    const exist = await _get('projects', {select: 'id,name', eq: {col: 'user_id', val: CURRENT_USER.id}});
    const dup = (exist || []).find(p => p.name === nm);
    if (dup) await _patch('projects', dup.id, payload); else await _post('projects', payload);
    toast('✓ 方案已保存：' + nm);
  };
}

/* ══════════════════════════ 启动 ══════════════════════════ */
async function bootData() {
  await Promise.all([loadBenchmarks(), loadMaterialPrices(), loadMainMatCats(), checkBackend()]);
}
(async function boot() {
  if (!localStorage.getItem('sb-access-token') && !IS_LOCAL) { showView('login'); return; }
  await refreshSession();
  await bootData();
  if (CURRENT_USER && CURRENT_USER.id) { renderHome(); showView('home'); }
  else if (IS_LOCAL) {
    const bak = localStorage.getItem('tool_draft_backup');
    renderHome(); showView('home');
    if (bak) { try { const d = JSON.parse(bak); if (d.groups && d.groups.length && confirm('本地有上次未提交的备份（' + new Date(d.t).toLocaleString('zh-CN') + '），是否恢复？')) { groups = d.groups; bumpUidFrom(groups); rebuildRowMap(); projName = d.projName || projName; readOnly = false; enterFlow(projName); } } catch (e) {} }
  } else { renderHome(); showView('login'); }
})();
</script>
